services:
  - type: web
    name: supportbot-studio
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build && cd ..
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: supportbot-db
      mountPath: /data
      sizeGB: 1
    envVars:
      # Set in Render dashboard → Environment. Use the Supabase
      # "Transaction" pooler URL (port 6543), not the direct :5432 URL —
      # Render workers are short-lived and pgBouncer-friendly.
      # Format: postgresql://postgres.<ref>:<pwd>@<region>.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        value: https://supportbot-studio.onrender.com
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ANTHROPIC_API_KEY
        sync: false
      # Auth — Multi-tenant (required)
      - key: JWT_SECRET_KEY
        sync: false
      - key: SUPER_ADMIN_USERNAME
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      # Notifications (optional)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: EMAILJS_SERVICE_ID
        sync: false
      - key: EMAILJS_TEMPLATE_ID
        sync: false
      - key: EMAILJS_PUBLIC_KEY
        sync: false
      - key: EMAILJS_PRIVATE_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_TO
        sync: false
      - key: ENV
        value: production
